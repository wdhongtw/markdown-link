name: check

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:

  "build":
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: make build

